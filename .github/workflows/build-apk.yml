name: Build Android APK

# 在 GitHub 上托管的 Ubuntu 容器里编译 APK - 无需本机配置 Android SDK
# 触发方式: 推送到 main 分支、打 v* 标签、或手动 workflow_dispatch
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 buildozer 及其系统依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            ccache git ccache
          pip install --upgrade pip
          # Pin buildozer 1.4.0: 新版强制 AAB 但 p4a stable 不支持
          pip install buildozer==1.4.0 cython==0.29.36

      - name: 缓存 buildozer 目录（加速后续构建）
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            packages/
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 构建 APK
        run: buildozer android debug

      - name: 上传 APK 至流水线产物
        uses: actions/upload-artifact@v4
        with:
          name: wuxian-kuaichuan-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
